name: paper-knowledge-base

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      # 构建时使用宿主机网络,规避容器内 DNS 不可用的问题
      network: host
      args:
        GO_IMAGE: "${GO_IMAGE:-golang:1.22-alpine}"
        GOPROXY_URL: "${GOPROXY_URL:-https://proxy.golang.org,direct}"
    env_file: ../.env
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      MYSQL_HOST: "${MYSQL_HOST:-host.docker.internal}"
      MYSQL_PORT: "${MYSQL_PORT:-3306}"
      UPLOAD_DIR: /app/uploads
      AUTO_MIGRATE: "${AUTO_MIGRATE:-true}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - paper_uploads:/app/uploads
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      network: host
      args:
        NODE_IMAGE: "${NODE_IMAGE:-node:22-alpine}"
        NGINX_IMAGE: "${NGINX_IMAGE:-nginx:1.27-alpine}"
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmjs.org}"
    depends_on: [api]
    ports: ["${HTTP_PORT:-80}:8080"]
    networks: [internal]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

volumes:
  paper_uploads:

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: "${DOCKER_SUBNET:-172.30.0.0/24}"
