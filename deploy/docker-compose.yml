name: paper-knowledge-base

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      # 构建时使用宿主机网络,规避容器内 DNS 不可用的问题
      network: host
      args:
        GO_IMAGE: "${GO_IMAGE:-golang:1.22-alpine}"
        GOPROXY_URL: "${GOPROXY_URL:-https://proxy.golang.org,direct}"
    env_file: ../.env
    # 运行时也使用宿主机网络:连 MySQL 走 127.0.0.1,无需改防火墙和 bind-address
    network_mode: host
    extra_hosts:
      - "host.docker.internal:127.0.0.1"
    environment:
      SERVER_HOST: 127.0.0.1
      SERVER_PORT: "${API_PORT:-8080}"
      MYSQL_HOST: "${MYSQL_HOST:-127.0.0.1}"
      MYSQL_PORT: "${MYSQL_PORT:-3306}"
      UPLOAD_DIR: /app/uploads
      AUTO_MIGRATE: "${AUTO_MIGRATE:-true}"
    volumes:
      - paper_uploads:/app/uploads
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/app/paper-kb", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      network: host
      args:
        NODE_IMAGE: "${NODE_IMAGE:-node:22-alpine}"
        NGINX_IMAGE: "${NGINX_IMAGE:-nginx:1.27-alpine}"
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmjs.org}"
    depends_on:
      api:
        condition: service_healthy
    network_mode: host
    environment:
      NGINX_HOST: "${NGINX_HOST:-127.0.0.1}"
      NGINX_PORT: "${HTTP_PORT:-8081}"
      API_PORT: "${API_PORT:-8080}"
    restart: unless-stopped

volumes:
  paper_uploads:
