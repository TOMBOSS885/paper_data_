name: paper-knowledge-base

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        GO_IMAGE: "${GO_IMAGE:-golang:1.22-alpine}"
    env_file: ../.env
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      MYSQL_HOST: "${MYSQL_HOST:-host.docker.internal}"
      MYSQL_PORT: "${MYSQL_PORT:-3306}"
      REDIS_ADDR: redis:6379
      REDIS_DB: "${REDIS_DB:-0}"
      UPLOAD_DIR: /app/uploads
      AUTO_MIGRATE: "${AUTO_MIGRATE:-true}"
    depends_on:
      redis: { condition: service_healthy }
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - paper_uploads:/app/uploads
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NODE_IMAGE: "${NODE_IMAGE:-node:22-alpine}"
        NGINX_IMAGE: "${NGINX_IMAGE:-nginx:1.27-alpine}"
    depends_on: [api]
    ports: ["${HTTP_PORT:-80}:8080"]
    networks: [internal]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  redis:
    image: "${REDIS_IMAGE:-redis:7.4-alpine}"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes: [redis_data:/data]
    networks: [internal]
    expose: ["6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  redis_data:
  paper_uploads:

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: "${DOCKER_SUBNET:-172.30.0.0/24}"
