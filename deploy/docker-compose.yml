name: paper-knowledge-base

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      MYSQL_HOST: mysql
      REDIS_ADDR: redis:6379
      UPLOAD_DIR: /app/uploads
      AUTO_MIGRATE: "${AUTO_MIGRATE:-true}"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - paper_uploads:/app/uploads
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    depends_on: [api]
    ports: ["${HTTP_PORT:-80}:8080"]
    networks: [internal]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USERNAME:?set MYSQL_USERNAME in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes: [mysql_data:/var/lib/mysql]
    networks: [internal]
    expose: ["3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes: [redis_data:/data]
    networks: [internal]
    expose: ["6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  paper_uploads:

networks:
  internal:
    driver: bridge
