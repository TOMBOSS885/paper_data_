<?xml version="1.0"?>
<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
        xmlns:html="http://www.w3.org/1999/xhtml"
        id="paper-kb-sync-window"
        title="Paper KB 同步">
  <html:link rel="stylesheet" href="sync.css" />
  <vbox flex="1">
    <hbox class="toolbar">
      <label id="summary" value="正在加载差异..." flex="1" />
      <button id="refresh" label="刷新" />
      <button id="close" label="关闭" />
    </hbox>
    <hbox class="filters">
      <button class="filter" data-status="all" label="全部" />
      <button class="filter" data-status="local_only" label="仅本地" />
      <button class="filter" data-status="server_only" label="仅服务器" />
      <button class="filter" data-status="both" label="双方都有" />
      <button class="filter" data-status="conflict" label="冲突" />
    </hbox>
    <html:div id="table-wrap" flex="1">
      <html:table id="diff-table">
        <html:thead><html:tr>
          <html:th></html:th><html:th>状态</html:th><html:th>题名</html:th>
          <html:th>作者/年份</html:th><html:th>DOI</html:th><html:th>附件</html:th>
          <html:th>动作</html:th>
        </html:tr></html:thead>
        <html:tbody id="rows"></html:tbody>
      </html:table>
    </html:div>
    <hbox class="footer">
      <label id="selected" value="已选 0 项" flex="1" />
      <button id="upload" label="上传所选" />
      <button id="pull" label="拉取所选" />
    </hbox>
  </vbox>
  <script src="sync-dialog.js" />
</window>
